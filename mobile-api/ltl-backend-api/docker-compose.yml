version: "3.9"

services:
  web:
    build: .
    command: gunicorn longtail.wsgi:application --workers 4 --threads 2 --bind 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/app/static
    networks:
      - app_network
    environment:
      DJANGO_SETTINGS_MODULE: longtail.settings

  nginx:
    image: nginx:alpine
    ports:
      - "8085:80"  # Expose port 8080 on the host to port 80 on the container
    volumes:
      - ./nginx/longtail_default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/static
    depends_on:
      - web
    networks:
      - app_network

volumes:
  static_volume:

networks:
  app_network:
    driver: bridge

